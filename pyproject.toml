[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resumemaker"
version = "0.1.0"
description = "Interview-driven resume generator with deterministic PDF rendering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danil M." }]
keywords = [
    "ats",
    "fastapi",
    "pdf",
    "postgresql",
    "resume",
    "telegram-bot",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/AkaDaka1/ResumeMaker"
Repository = "https://github.com/AkaDaka1/ResumeMaker"
Issues = "https://github.com/AkaDaka1/ResumeMaker/issues"
Changelog = "https://github.com/AkaDaka1/ResumeMaker/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
    # FastAPI 0.162 prefers `httpx2` for its TestClient; the suite uses the traditional httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
    "integration: tests that need a live PostgreSQL server",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["resumemaker"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL is long by nature; it is reviewed, not hand-formatted.
"migrations/versions/*.py" = ["E501"]